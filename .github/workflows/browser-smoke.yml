name: VYRALVERSE browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vyralverse-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vyralverse-http.log
          exit 1
      - name: Run browser smoke tests
        run: node tests/smoke.mjs
      - name: Check Cloudflare Pages deployment (non-blocking)
        if: always()
        shell: bash
        run: |
          live_ok=0
          for i in {1..6}; do
            if curl -fsSL --max-time 20 https://vyralverse.pages.dev/ -o /tmp/vyralverse-live.html; then
              if grep -q "Choose your next move." /tmp/vyralverse-live.html; then live_ok=1; break; fi
            fi
            sleep 10
          done
          if [ "$live_ok" -eq 1 ] && curl -fsSL --max-time 20 https://vyralverse.pages.dev/nexus-visual-builder.html -o /tmp/vyralverse-builder.html && grep -q "NEXUS VISUAL BUILDER" /tmp/vyralverse-builder.html && curl -fsSL --max-time 20 https://vyralverse.pages.dev/godseye/index.html -o /tmp/vyralverse-godseye.html && grep -q "GODSEYE" /tmp/vyralverse-godseye.html && curl -fsSL --max-time 20 https://vyralverse.pages.dev/godseye/app.js -o /tmp/vyralverse-godseye.js && grep -q "api.kartaview.org/2.0/photo/" /tmp/vyralverse-godseye.js; then
            adsb_status=$(curl -sS --max-time 20 -o /tmp/vyralverse-adsb-check.json -w '%{http_code}' 'https://vyralverse.pages.dev/api/adsb?lat=999&lon=0')
            if [ "$adsb_status" = "400" ]; then
              echo "Cloudflare Pages serves the homepage, Visual Builder, GODSEYE assets and ADS-B function validation."
            else
              echo "::warning::GODSEYE assets are live, but ADS-B Pages Function validation returned HTTP $adsb_status."
            fi
          else
            echo "::warning::Cloudflare Pages GODSEYE deployment is not yet verified or is still deploying. GitHub source checks remain separate."
          fi
