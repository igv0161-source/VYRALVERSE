name: VYRALVERSE browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vyralverse-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vyralverse-http.log
          exit 1
      - name: Run browser smoke tests
        run: node tests/smoke.mjs
      - name: Check Cloudflare Pages deployment (non-blocking)
        if: always()
        shell: bash
        run: |
          live_ok=0
          for i in {1..6}; do
            if curl -fsSL --max-time 20 https://vyralverse.pages.dev/ -o /tmp/vyralverse-live.html; then
              if grep -q "Choose your next move." /tmp/vyralverse-live.html; then live_ok=1; break; fi
            fi
            sleep 10
          done
          if [ "$live_ok" -eq 1 ] && curl -fsSL --max-time 20 https://vyralverse.pages.dev/nexus-visual-builder.html -o /tmp/vyralverse-builder.html && grep -q "NEXUS VISUAL BUILDER" /tmp/vyralverse-builder.html && curl -fsSL --max-time 20 https://vyralverse.pages.dev/godseye/index.html -o /tmp/vyralverse-godseye.html && grep -q "GODSEYE" /tmp/vyralverse-godseye.html && curl -fsSL --max-time 20 https://vyralverse.pages.dev/godseye/app.js -o /tmp/vyralverse-godseye.js && grep -q "api.kartaview.org/2.0/photo/" /tmp/vyralverse-godseye.js && grep -q "/api/satellites?group=" /tmp/vyralverse-godseye.js && grep -q "/api/launches" /tmp/vyralverse-godseye.js && grep -q "/api/cyclones" /tmp/vyralverse-godseye.js && grep -q "GDACS" /tmp/vyralverse-godseye.html && grep -q "Launch Library 2" /tmp/vyralverse-godseye.html && ! grep -q "wss://stream.aisstream.io" /tmp/vyralverse-godseye.js && curl -fsSL --max-time 20 https://vyralverse.pages.dev/godseye/tallinn-cameras.json -o /tmp/vyralverse-tallinn-cameras.json && grep -q "City of Tallinn" /tmp/vyralverse-tallinn-cameras.json; then
            adsb_status=$(curl -sS --max-time 20 -o /tmp/vyralverse-adsb-check.json -w '%{http_code}' 'https://vyralverse.pages.dev/api/adsb?lat=999&lon=0')
            vessels_status=$(curl -sS --max-time 20 -o /tmp/vyralverse-vessels-check.json -w '%{http_code}' 'https://vyralverse.pages.dev/api/vessels?lat=0&lon=0')
            satellite_status=$(curl -sS --max-time 20 -o /tmp/vyralverse-satellite-check.txt -w '%{http_code}' 'https://vyralverse.pages.dev/api/satellites?group=not-a-real-catalogue')
            launches_status=$(curl -sS --max-time 20 -X POST -o /tmp/vyralverse-launches-check.json -w '%{http_code}' 'https://vyralverse.pages.dev/api/launches')
            cyclones_status=$(curl -sS --max-time 25 -o /tmp/vyralverse-cyclones-check.json -w '%{http_code}' 'https://vyralverse.pages.dev/api/cyclones')
            if [ "$adsb_status" = "400" ] && { [ "$vessels_status" = "200" ] || [ "$vessels_status" = "503" ]; } && [ "$satellite_status" = "400" ] && [ "$launches_status" = "405" ] && [ "$cyclones_status" = "200" ] && grep -q "AISStream" /tmp/vyralverse-vessels-check.json && grep -q "FeatureCollection" /tmp/vyralverse-cyclones-check.json; then
              echo "Cloudflare Pages serves the homepage, Visual Builder, GODSEYE, satellite/camera data, ADS-B validation, secure AIS proxy, Launch Library 2 method guard and live GDACS GeoJSON endpoint."
            else
              echo "::warning::GODSEYE assets are live, but one or more data function checks failed (ADS-B $adsb_status, AIS $vessels_status, satellites $satellite_status, launches $launches_status, GDACS $cyclones_status)."
            fi
          else
            echo "::warning::Cloudflare Pages GODSEYE deployment is not yet verified or is still deploying. GitHub source checks remain separate."
          fi
